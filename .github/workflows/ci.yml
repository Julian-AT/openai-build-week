name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  workspace:
    name: Bun, API, web, and vision
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-dependency-glob: apps/vision/uv.lock
          enable-cache: true
          version: 0.11.16

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install locked Python dependencies
        run: uv sync --project apps/vision --frozen

      - name: Run the complete workspace gate
        run: bun run check

  swift:
    name: Swift contracts and iOS app
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Report Apple toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test deterministic Swift packages
        run: swift test --package-path apps/ios/Packages/SpatialCore

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          simulator_udid="$({ xcrun simctl list devices available -j || exit 1; } | python3 -c 'import json, sys; devices = [device for runtime in json.load(sys.stdin)["devices"].values() for device in runtime if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; preferred = next((device for device in devices if device["name"] == "iPhone 17"), devices[0] if devices else None); print(preferred["udid"] if preferred else "")')"
          test -n "$simulator_udid"
          printf 'udid=%s\n' "$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Build the native app
        run: |
          xcodebuild build \
            -project apps/ios/Reframe/Reframe.xcodeproj \
            -scheme Reframe \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/reframe-derived-data" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Reject vulnerable or non-shipping dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: AGPL-3.0, BUSL-1.1, CC-BY-NC-4.0, GPL-2.0, GPL-3.0, SSPL-1.0
          fail-on-severity: moderate
